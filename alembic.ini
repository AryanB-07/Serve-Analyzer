# Alembic CLI config, for writing new migrations:
#   uv run alembic revision --autogenerate -m "describe the change"
# The database URL comes from SERVE_API_DATABASE_URL (default: SQLite in var/).
# To apply migrations, use `uv run python -m serve_api.migrate`.

[alembic]
script_location = serve_api/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
