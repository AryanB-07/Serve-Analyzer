[project]
name = "serve-analyzer"
version = "0.1.0"
description = "Tennis serve technique analysis from a single side-on video"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # 1.0.x aborts on macOS arm64 when creating vision tasks (google-ai-edge/mediapipe#6356).
    "mediapipe>=0.10.30,<1.0",
    "opencv-contrib-python>=4.9",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
    "httpx2>=2.13",
    "moto[server]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serve_analyzer", "serve_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs the full pipeline on a real video clip"]
